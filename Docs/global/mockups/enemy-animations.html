const SIZE = {
  crawler: ['h', 1], tarblob: ['h', 1.3], tinnik: ['h', 1.8], rootling: ['h', 2], stoneeater: ['h', 2],
  drowned: ['h', 2.4], lamplighter: ['h', 2.4], armor: ['h', 2.5], avalanche: ['h', 2.5], shade: ['h', 2.8],
  mistmother: ['h', 3], stag: ['h', 3], brute: ['h', 3.5], stilt: ['h', 5], golem: ['h', 6], cedarguard: ['h', 7], keeper: ['h', 10],

// ================= облик уровней: туман забирает существо =================
// Матёрый: иней и синеватый отлив, ледяная броня сверху, светящиеся трещины, изморозь под ногами.

// ===== base: общие помощники этого файла =====
const BASE_CRACK = 0x9fd8ff, BASE_GLOW = 0x7fc3ff, BASE_WISP = 0xaabfd2;
// светящаяся трещина-ломаная
function base_crack(b, pts, w, l, o = {}) {
  for (let i = 0; i < pts.length - 1; i++) b.S(pts[i], pts[i + 1], w, w * .7, BASE_CRACK, { emissive: BASE_GLOW, ei: (o.ei ?? .7) + l * .4, sides: 4, parent: o.parent });
}
// плоская полоса (ткань, ремень) между точками; yaw поворачивает ширину вокруг оси
function base_plank(b, a, c, w, t, color, yaw = 0, o = {}) {
  const A = V3(a), B = V3(c), len = A.distanceTo(B);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, len, t), M(color, o));
  m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize()); m.rotateY(yaw);
  return b.add(m, o.parent);
}
// рваная тканевая лента: два сужающихся куска и зубец
function base_strip(b, top, len, w, color, yaw, out = [0, 0], o = {}) {
  const mid = [top[0] + out[0] * .5, top[1] - len * .55, top[2] + out[1] * .5], end = [top[0] + out[0], top[1] - len, top[2] + out[1]];
  base_plank(b, top, mid, w, .015, color, yaw, o);
  base_plank(b, mid, end, w * .7, .015, color, yaw, o);
  b.K([end[0], end[1] + .03, end[2]], [out[0] * .3, -1, out[1] * .3], w * .35, len * .2, color, { sides: 3, ...o });
}
// кольцо (тор)
function base_ring(b, c, r, tube, color, rot, o = {}) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, o.rs ?? 4, o.ts ?? 10), M(color, o));
  m.position.set(...c); if (rot) m.rotation.set(...rot); if (o.scale) m.scale.set(...o.scale); return b.add(m, o.parent);
}
// пучок шерсти из маленьких конусов
function base_tuft(b, c, dir, n, r, h, color, seed, o = {}) {
  const rr = rngC(seed);
  for (let i = 0; i < n; i++) {
    const d = [dir[0] + (rr() - .5) * .9, dir[1] + (rr() - .5) * .9, dir[2] + (rr() - .5) * .9];
    b.K([c[0] + (rr() - .5) * r * 3, c[1] + (rr() - .5) * r * 2, c[2] + (rr() - .5) * r * 3], d, r, h * (.7 + rr() * .6), color, { sides: 3, ...o });
  }
}
// клок тумана
// клочья тумана убраны у всех существ: выглядели как твёрдые шары
function base_wisp() { return null; }
// сустав-цепочка с чередованием цветов сегментов и отдельным цветом суставов
function base_limb(b, pts, r0, r1, colors, jointColor, o = {}) {
  for (let i = 0; i < pts.length - 1; i++) {
    const ra = r0 + (r1 - r0) * i / (pts.length - 1), rb = r0 + (r1 - r0) * (i + 1) / (pts.length - 1);
    b.S(pts[i], pts[i + 1], ra, rb, colors[i % colors.length], o);
    if (i > 0) b.E(pts[i], ra * 1.3, jointColor, null, { ...o, detail: 0, j: .25 });
  }
}

    b.S([.02, 2.33, -.12], [.14, 2.37, -.12], .015, .012, C.bone); b.S([.08, 2.3, -.12], [.08, 2.18, -.12], .012, .008, C.bone);
    base_wisp(b, [0, 2.6, -.3], .2, .1); base_wisp(b, [.1, 2.4, -.5], .14, .08);
    const eyes = [[.08, 2.8, .26], [-.08, 2.8, .26], [0, 2.75, .28], [.13, 2.84, .21], [-.13, 2.84, .21]];
    eyes.slice(0, [2, 3, 5][l]).forEach(e => b.eye(e, .025));
    b.frost([[[0, 3.12, 0], [0, 1, 0]], [[.15, 3.05, -.15], [.4, 1, -.4]], [[-.15, 3.05, .15], [-.4, 1, .4]], [[.6, 3.3, .6], [.3, 1, .3]], [[-.6, 3.3, -.6], [-.3, 1, -.3]]]);
  } });

// ================= местные =================

// ===== Ползун с суставами и процедурными анимациями =====
// Модель берётся из бестиария (crawler), тело делится на части с шарнирами (грудь, голова, жвалы,
// брюшко, хвост), а шесть лап собираются заново: бедро и голень, колено считается двухзвенной IK
// от тазобедренного сустава до ступни. Ступни ставятся походкой «треногой», как у насекомых.
// Все размеры в единицах модели; корень масштабируется до роста 1 блок (× уровень).

const RIG_LEVEL_SCALE = [1, 1.18, 1.36];
const LEG_L1 = .3, LEG_L2 = .42;                     // бедро и голень
const HIPS = [.14, 0, -.14];                            // z тазобедренных суставов: передняя, средняя, задняя пары
const FEET = [.4, .03, -.34];                           // z ступней в покое
const FOOT_X = .52;
const TRIPOD = [[0, 1, 0], [1, 0, 1]];                  // [сторона L/R][пара] → группа треноги 0/1 (L0,R1,L2 и R0,L1,R2)
const MOUTH = new THREE.Vector3(0, .24, .42);

function rigTint(color, l) {
  const c = new THREE.Color(color);
  if (l) c.lerp(new THREE.Color(l === 1 ? 0x8fb4d4 : 0xb8d8f0), l === 1 ? .3 : .45);
  return c;
}

class CrawlerRig {
  constructor(level) {
    this.level = level;
    const def = CREATURES.find(d => d.id === 'crawler');
    const b = new Builder(level, def.id.length * 7 + 1);
    def.build(b, level);
    const g = b.finish(def);
    g.updateMatrixWorld(true);

    this.root = new THREE.Group();
    this.body = this.pivot(this.root, [0, .3, 0]);
    this.thorax = this.pivot(this.body, [0, .3, 0]);
    this.head = this.pivot(this.body, [0, .3, .22]);
    this.jaw = [this.pivot(this.head, [-.05, .27, .33]), this.pivot(this.head, [.05, .27, .33])];
    this.abdomen = this.pivot(this.body, [0, .3, -.04]);
    this.tail = this.pivot(this.abdomen, [0, .3, -.46]);
    this.ground = this.pivot(this.root, [0, 0, 0]);

    // все материалы свои у каждого ползуна: их гасят, подсвечивают и делают прозрачными
    this.mats = new Map(); this.sprites = [];
    this.root.updateMatrixWorld(true);
    const items = []; g.traverse(o => { if (o !== g && (o.isMesh || o.isSprite || o.isLight)) items.push(o); });
    const p = new THREE.Vector3();
    for (const o of items) {
      o.getWorldPosition(p);
      const tiny = o.isMesh && o.geometry.parameters?.radius === 1 && o.scale.x < .02;
      let target;
      if (o.userData.lvlAdd && p.y < .06) target = this.ground;
      else if (o.userData.orbit) { target = this.body; }
      else if (Math.abs(p.x) > .13 && p.y < .5 && p.z > -.22 && p.z < .27 && !tiny && !o.isSprite && !o.isLight) { o.parent.remove(o); continue; } // старые лапы
      else if (p.z > .2) target = (Math.abs(p.x) >= .03 && p.y < .29 && p.z > .33) ? this.jaw[p.x < 0 ? 0 : 1] : this.head;
      else if (p.z < -.45) target = this.tail;
      else if (p.z < -.02) target = this.abdomen;
      else target = this.thorax;
      target.attach(o);
      if (o.isMesh) o.material = this.own(o.material);
      if (o.isSprite) { o.material = o.material.clone(); this.sprites.push(o); }
    }
    this.root.scale.setScalar(RIG_LEVEL_SCALE[level] * sizeFactor(def));
    this.belly = [...this.mats.values()].filter(m => m.emissive && m.emissive.getHex() === 0x5a86a8);

    // новые лапы: бедро, колено, голень, шип колена, два когтя
    const l = level, op = l === 2 ? { transparent: true, opacity: .6 } : {};
    const mk = (c) => this.own(new THREE.MeshStandardMaterial({ color: rigTint(c, l), roughness: .85, flatShading: true, emissive: l ? new THREE.Color(l === 1 ? 0x0e2034 : 0x24527c) : 0x000000, ...op }));
    const segMat = [mk(C.fog), mk(C.fogDark)], jointMat = mk(0x3e4856), clawMat = mk(C.claw), spikeMat = mk(0x6c7682);
    this.legs = [];
    for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
      const leg = { s, i, group: TRIPOD[s < 0 ? 0 : 1][i], hip: new THREE.Vector3(s * .12, .3, HIPS[i]), rest: new THREE.Vector3(s * FOOT_X, .02, FEET[i]) };
      leg.foot = leg.rest.clone(); leg.plant = leg.rest.clone();
      const seg = (r0, r1, m) => { const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, 1, 5), m); mesh.castShadow = true; this.root.add(mesh); return mesh; };
      leg.femur = seg(.035, .026, segMat[i % 2]); leg.tibia = seg(.026, .012, segMat[(i + 1) % 2]);
      leg.knee = new THREE.Mesh(new THREE.IcosahedronGeometry(.034, 0), jointMat); leg.knee.castShadow = true; this.root.add(leg.knee);
      leg.spike = new THREE.Mesh(new THREE.ConeGeometry(.012, .06, 4), spikeMat); this.root.add(leg.spike);
      leg.claws = [0, 1].map(() => { const c = new THREE.Mesh(new THREE.ConeGeometry(.01, .045, 4), clawMat); this.root.add(c); return c; });
      this.legs.push(leg);
    }
    // состояние
    this.t = 0; this.gait = 0; this.speed = 0; this.pose = { crouch: 0, latch: 0, recoil: 0, fold: 0, flash: 0, fade: 0, chew: 0, glow: 0 };
    this.solveLegs(0);
  }
  // шарнир в точке at (координаты модели); позиция хранится относительно родительского шарнира
  pivot(parent, at) { const g = new THREE.Group(), pr = parent.userData.rest || [0, 0, 0]; g.userData.rest = at; g.position.set(at[0] - pr[0], at[1] - pr[1], at[2] - pr[2]); parent.add(g); parent.updateMatrixWorld(true); return g; }
  own(m) { if (!this.mats.has(m)) { const c = m.clone(); c.userData.base = { emissive: c.emissive?.clone(), ei: c.emissiveIntensity, opacity: c.opacity, transparent: c.transparent }; this.mats.set(m, c); this.mats.set(c, c); } return this.mats.get(m); }

  // двухзвенная IK: колено поднято вверх и наружу
  solveLeg(leg, hipR) {
    const F = leg.foot, d0 = F.clone().sub(hipR), d = Math.min(d0.length(), LEG_L1 + LEG_L2 - .001);
    const dir = d0.normalize();
    const a = (LEG_L1 * LEG_L1 - LEG_L2 * LEG_L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, LEG_L1 * LEG_L1 - a * a));
    const pole = new THREE.Vector3(leg.s * .9, .8, 0).sub(dir.clone().multiplyScalar(dir.dot(new THREE.Vector3(leg.s * .9, .8, 0)))).normalize();
    const K = hipR.clone().addScaledVector(dir, a).addScaledVector(pole, h);
    const footR = hipR.clone().addScaledVector(dir, d);
    this.place(leg.femur, hipR, K); this.place(leg.tibia, K, footR);
    leg.knee.position.copy(K);
    leg.spike.position.copy(K).addScaledVector(pole, .03); leg.spike.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pole.clone().add(new THREE.Vector3(leg.s * .3, 0, 0)).normalize());
    leg.claws.forEach((c, k) => { const cd = new THREE.Vector3(leg.s * .4, -.6, k ? .6 : -.6).normalize(); c.position.copy(footR).addScaledVector(cd, .02); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cd); });
  }
  place(mesh, A, B) { const d = B.clone().sub(A); mesh.position.copy(A).addScaledVector(d, .5); mesh.scale.set(1, d.length(), 1); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); }
  solveLegs() {
    this.body.updateMatrix(); this.thorax.updateMatrix();
    const m = this.body.matrix.clone().multiply(this.thorax.matrix);
    const inv = new THREE.Matrix4().makeTranslation(0, -.3, 0); // тазы заданы в координатах модели
    for (const leg of this.legs) this.solveLeg(leg, leg.hip.clone().applyMatrix4(inv).applyMatrix4(m));
  }

  // ---------- поведение за кадр ----------
  // speed — скорость бега в единицах модели/с (0 — стоит); opts: latch (0..1 присосался), fold (0..1 смерть)
  update(dt, speed) {
    this.t += dt; const t = this.t, P = this.pose;
    // походка: цикл треноги, частота растёт со скоростью
    const run = Math.min(1, speed / 1.2);
    this.speed += (speed - this.speed) * Math.min(1, dt * 8);
    const cycle = .3, stance = .55, stride = this.speed * cycle * stance;
    if (this.speed > .02) this.gait = (this.gait + dt / cycle) % 1;
    for (const leg of this.legs) {
      const ph = (this.gait + leg.group * .5) % 1;
      const target = leg.rest.clone();
      if (this.speed > .02) {
        if (ph < 1 - stance) { const k = ph / (1 - stance); target.z += stride * (k - .5); target.y += Math.sin(k * Math.PI) * (.06 + .1 * run); }   // перенос лапы вперёд по дуге
        else { const k = (ph - (1 - stance)) / stance; target.z += stride * (.5 - k); }                                                              // опора: лапа уходит назад
      } else {
        // покой: изредка переставляет одну лапу
        const shuffle = Math.sin(t * .9 + leg.i * 2.1 + leg.s) ; if (shuffle > .97) target.y += (shuffle - .97) * 2.5;
      }
      // присосался: передние лапы обнимают костёр, остальные шире
      if (P.latch > 0) { if (leg.i === 0) { target.z += .18 * P.latch; target.x -= leg.s * .12 * P.latch; target.y += .05 * P.latch; } else target.x += leg.s * .05 * P.latch; }
      // удар: лапы дёргаются
      if (P.recoil > 0) { target.x += Math.sin(t * 45 + leg.i * 3 + leg.s) * .05 * P.recoil; target.y += Math.max(0, Math.sin(t * 38 + leg.i)) * .08 * P.recoil; }
      // смерть: лапы поджимаются под тело
      if (P.fold > 0) { target.lerp(new THREE.Vector3(leg.s * .2, .28, leg.hip.z * .8), P.fold * .85); }
      leg.foot.copy(target);
    }
    // тело: покачивание на бегу, дыхание в покое, приседание при ударе/смерти
    const breath = Math.sin(t * 2.2);
    const bob = this.speed > .02 ? Math.abs(Math.sin(this.gait * Math.PI * 2)) * .025 : breath * .006;
    this.body.position.y = .3 + bob - .07 * P.latch - .22 * P.fold + .03 * P.recoil;
    this.body.position.z = -.12 * P.recoil;
    this.body.rotation.x = .08 * P.latch - .35 * P.recoil + (this.speed > .02 ? .04 : 0) - .1 * P.fold;
    this.body.rotation.z = (this.speed > .02 ? Math.sin(this.gait * Math.PI * 2) * .05 : 0) + Math.sin(t * 50) * .06 * P.recoil + .5 * P.fold * Math.sin(1.3);
    this.thorax.scale.set(1 + breath * .015, 1 + breath * .02, 1);
    // голова: оглядывается в покое, опущена у огня, жвалы жуют
    const look = this.speed > .02 || P.latch > 0 ? 0 : Math.sin(t * .7) * .35 * Math.max(0, Math.sin(t * .31 + 1));
    this.head.rotation.y = look * (1 - P.fold);
    this.head.rotation.x = .25 * P.latch + Math.sin(t * 9) * .05 * P.latch - .3 * P.recoil + .3 * P.fold;
    const chew = P.latch > 0 ? (.35 + Math.sin(t * 14) * .3) * P.latch : (Math.sin(t * 3.3) > .9 ? .2 : 0) + .4 * P.recoil;
    this.jaw[0].rotation.y = chew; this.jaw[1].rotation.y = -chew;
    // брюшко: сзади раскачивается, у огня пульсирует жаром, хвост поджимается
    this.abdomen.rotation.y = this.speed > .02 ? Math.sin(this.gait * Math.PI * 2) * .12 : Math.sin(t * 1.3) * .05;
    const pulse = P.latch > 0 ? 1 + Math.max(0, Math.sin(t * 6)) * .1 * P.latch : 1;
    this.abdomen.scale.set(pulse, pulse, 1 + (pulse - 1) * .5);
    this.abdomen.rotation.x = -.1 * P.recoil + .2 * P.fold;
    this.tail.rotation.x = Math.sin(t * 2.5) * .12 + .5 * P.latch + .6 * P.recoil + .8 * P.fold;
    // свечение брюха от вытянутого жара, вспышка при ударе, растворение
    for (const m of this.belly) { m.emissive.setRGB(.35 + P.glow * .65, .52 + P.glow * .2, .66 - P.glow * .4); m.emissiveIntensity = .4 + P.glow * 1.6; }
    for (const m of new Set(this.mats.values())) {
      const b = m.userData.base;
      if (m.emissive && !this.belly.includes(m)) { m.emissive.copy(b.emissive).lerp(new THREE.Color(0xdff4ff), P.flash); m.emissiveIntensity = b.ei + P.flash * 1.5; }
      m.transparent = b.transparent || P.fade > 0; m.opacity = b.opacity * (1 - P.fade); m.depthWrite = P.fade < .3 && (!b.transparent || b.opacity > .7);
    }
    for (const s of this.sprites) s.material.opacity = (1 - P.fade) * (1 - P.fold * .7);
    this.solveLegs();
  }
  mouthWorld() { return this.head.localToWorld(MOUTH.clone().sub(new THREE.Vector3(0, .3, .22))); }
}

// ===== Риги остальных базовых врагов: громила, тень, мотыльки, туманница, ходуля =====
// Общая основа: модель из бестиария делится на части с шарнирами по положению деталей
// (координаты модели), материалы клонируются на каждый экземпляр: их подсвечивают при ударе
// и растворяют при смерти. Поза задаётся полями pose: act (атака по роли), recoil (удар),
// flash (вспышка), fold (падение при смерти), fade (растворение), vis (видимость тени).
const FLASH_COL = new THREE.Color(0xdff4ff);
const ease = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const seg01 = (k, a, b) => ease((k - a) / (b - a));
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

class Rig {
  constructor(id, level) {
    this.id = id; this.level = level; this.def = CREATURES.find(d => d.id === id);
    const b = new Builder(level, id.length * 7 + 1); this.def.build(b, level);
    this.model = b.finish(this.def); this.model.updateMatrixWorld(true);
    this.root = new THREE.Group(); this.ground = this.pivot(this.root, [0, 0, 0]);
    this.mats = new Map(); this.sprites = []; this.t = 0; this.speed = 0; this.gait = 0;
    this.scale = RIG_LEVEL_SCALE[level] * sizeFactor(this.def);
    this.pose = { recoil: 0, flash: 0, fade: 0, fold: 0, act: 0, glow: 0, vis: 1, over: 0 };
    this.hc = 1;                                               // высота центра тела (для частиц удара)
  }
  pivot(parent, at) { const g = new THREE.Group(), pr = parent.userData.rest || [0, 0, 0]; g.userData.rest = at; g.position.set(at[0] - pr[0], at[1] - pr[1], at[2] - pr[2]); parent.add(g); parent.updateMatrixWorld(true); return g; }
  own(m) { if (!this.mats.has(m)) { const c = m.clone(); c.userData.base = { emissive: c.emissive?.clone(), ei: c.emissiveIntensity, opacity: c.opacity, transparent: c.transparent }; this.mats.set(m, c); this.mats.set(c, c); } return this.mats.get(m); }
  adopt(o, target) { target.attach(o); if (o.isMesh) o.material = this.own(o.material); if (o.isSprite) { o.material = o.material.clone(); this.sprites.push(o); } }
  // раскладывает детали модели по шарнирам; classify(деталь, точка) → шарнир или null (убрать)
  split(classify) {
    this.root.updateMatrixWorld(true);
    const items = []; this.model.traverse(o => { if (o !== this.model && (o.isMesh || o.isSprite || o.isLight)) items.push(o); });
    const p = V();
    for (const o of items) {
      o.getWorldPosition(p);
      const tgt = o.userData.lvlAdd && p.y < .06 ? this.ground : classify(o, p);
      if (!tgt) { o.parent.remove(o); continue; }
      if (Array.isArray(tgt)) { this.adopt(o, tgt[0]); o.position.set(...tgt[1]); continue; }   // [шарнир, новое место]
      this.adopt(o, tgt);
    }
    this.root.scale.setScalar(this.scale);
  }
  fx() {
    const P = this.pose, op = (1 - P.fade) * (.1 + .9 * P.vis);
    for (const m of new Set(this.mats.values())) {
      const b = m.userData.base;
      if (m.emissive) { m.emissive.copy(b.emissive).lerp(FLASH_COL, P.flash); m.emissiveIntensity = b.ei + P.flash * 1.5; }
      m.transparent = b.transparent || op < .999; m.opacity = b.opacity * op; m.depthWrite = op > .7 && (!b.transparent || b.opacity > .7);
    }
    for (const s of this.sprites) s.material.opacity = (s.userData.glow ?? 1) * op * (1 - P.fold * .7);
  }
  // точка модели, закреплённая на шарнире, в мировых координатах
  world(piv, at) { const r = piv.userData.rest || [0, 0, 0]; return piv.localToWorld(V(at[0] - r[0], at[1] - r[1], at[2] - r[2])); }
  center() { return this.root.localToWorld(V(0, this.hc, 0)); }
}

// ---------- Громила: тяжёлый шаг, удар двумя кулаками сверху ----------
class BruteRig extends Rig {
  constructor(level) {
    super('brute', level);
    const R = this.root, S = [-1, 1];
    this.hips = this.pivot(R, [0, .86, 0]);
    this.torso = this.pivot(this.hips, [0, .92, 0]);
    this.head = this.pivot(this.torso, [0, 1.4, .45]);
    this.sh = S.map(s => this.pivot(this.torso, [s * .88, 1.62, .12]));
    this.el = S.map((s, i) => this.pivot(this.sh[i], [s * 1.08, .95, .45]));
    this.hip = S.map(s => this.pivot(this.hips, [s * .36, .85, -.2]));
    this.kn = S.map((s, i) => this.pivot(this.hip[i], [s * .42, .48, -.05]));
    this.split((o, p) => {
      const ax = Math.abs(p.x), i = p.x < 0 ? 0 : 1;
      if (ax > .62 && p.y < 1.55) return p.y > .97 ? this.sh[i] : this.el[i];   // руки: плечо и предплечье с кулаком
      if (ax > .27 && p.y < .8) return p.y > .5 ? this.hip[i] : this.kn[i];      // ноги: бедро и голень
      if (p.z > .515 && p.y > 1.15 && ax < .45) return this.head;
      return p.y < .9 ? this.hips : this.torso;
    });
    this.hc = 1.3;
  }
  // act — фаза одного удара 0..1: замах (до .45), пауза, удар (.58–.66), возврат
  update(dt, speed) {
    this.t += dt; const t = this.t, P = this.pose;
    this.speed += (speed - this.speed) * Math.min(1, dt * 4);
    const v = this.speed, w = Math.min(1, v / .25), A = .3, L = .78;
    if (v > .01) this.gait += dt * v / (4 * L * Math.sin(A));             // частота шага под скорость: ступни не скользят
    const q = this.gait * Math.PI * 2, br = Math.sin(t * 1.5), k = P.act, r = P.recoil, f = P.fold;
    const raise = k > 0 ? seg01(k, 0, .45) * (1 - seg01(k, .58, .66)) : 0;
    const slam = k > 0 ? seg01(k, .58, .66) * (1 - seg01(k, .72, 1)) : 0;
    const look = (1 - w) * (1 - Math.min(1, k * 4)) * Math.sin(t * .45) * .4 * Math.max(0, Math.sin(t * .23 + 1));
    this.hips.position.y = .86 - .05 * w * Math.sin(q) ** 2 - .1 * slam - .42 * f;
    this.hips.position.z = -.08 * r;
    this.hips.rotation.x = .25 * f;
    this.torso.rotation.x = .1 * w + .02 * br - .22 * raise + .45 * slam - .2 * r + .55 * f;
    this.torso.rotation.y = .12 * w * Math.sin(q) + .2 * r;
    this.torso.rotation.z = .07 * w * Math.sin(q);
    this.torso.scale.set(1 + .012 * br, 1 + .02 * br, 1 + .012 * br);
    this.head.rotation.x = -.35 * raise + .2 * slam - .45 * r + .35 * f + (Math.sin(t * 2.6) > .97 ? -.15 : 0) * (1 - w);
    this.head.rotation.y = look - .08 * w * Math.sin(q);
    for (let i = 0; i < 2; i++) {

// ---------- Мотыльки: каждый летит сам, стайка держится облаком ----------
class MothsRig extends Rig {

    this.hc = 1.6;
  }
  update(dt, speed) {
    this.t += dt; const t = this.t, P = this.pose;
    this.speed += (speed - this.speed) * Math.min(1, dt * 3);
    const w = Math.min(1, this.speed / .5), a = P.act, r = P.recoil, f = P.fold, n = this.moths.length;
    let cl = null;
    if (this.cling && a > 0) { this.root.updateMatrixWorld(true); cl = this.root.worldToLocal(this.cling.clone()); }
    this.moths.forEach((m, i) => {
      const ph = m.ph, tt = t * m.sp;
      // облако в покое, вытянутый поток в полёте
      const cloud = V(Math.cos(tt * .6 + ph) * .6, 1.6 + Math.sin(tt * 1.1 + ph * 2) * .25, Math.sin(tt * .6 + ph) * .5);
      const stream = V(Math.sin(tt * 2 + ph) * .35, 1.6 + Math.sin(tt * 3 + ph) * .15, (i - (n - 1) / 2) * .3 + Math.sin(tt * 1.3 + ph) * .1);

  }

// ---------- Туманница: медленный шаг на четырёх ногах, вдох мешком и выдох туманом ----------
class MistRig extends Rig {
  constructor(level) {
    super('mistmother', level);
    this.body = this.pivot(this.root, [0, .95, -.15]);
    this.sac = this.pivot(this.body, [0, 1.25, -.45]);
    this.head = this.pivot(this.body, [0, 1.3, .2]);
    this.trunk = this.pivot(this.head, [0, 1.27, .4]);
    // ноги: передняя и задняя с каждой стороны, шарнир в тазу и в колене
    this.legs = [];
    for (const s of [-1, 1]) for (const k of [0, 1]) {
      const hip = this.pivot(this.root, k ? [s * .25, .85, -.4] : [s * .3, .9, 0]);
      const knee = this.pivot(hip, k ? [s * .46, .58, -.55] : [s * .48, .62, .1]);
      this.legs.push({ s, k, hip, knee });
    }
    const leg = (s, k) => this.legs.find(l => l.s === s && l.k === k);
    this.split((o, p) => {
      const ax = Math.abs(p.x);
      if (ax > .27 && p.y < .95) { const l = leg(p.x < 0 ? -1 : 1, p.z > -.2 ? 0 : 1); return p.y < .6 ? l.knee : l.hip; }
      if (p.y > 1.15 && p.z < -.1) return this.sac;
      if (p.z > .38 && p.y < 1.3 && ax < .22) return this.trunk;
      if (p.z > .15 && p.y > 1.15) return this.head;
      return this.body;
    });
    this.hc = 1.3;
  }
  // act — фаза цикла: вдох (мешок раздувается) до .45, выдох .45–.9
  update(dt, speed) {
    this.t += dt; const t = this.t, P = this.pose;

    const v = this.speed, w = Math.min(1, v / .2), A = .25, L = .85;

    const inhale = k > 0 ? seg01(k, 0, .4) * (1 - seg01(k, .48, .9)) : 0, exhale = k > 0 ? seg01(k, .42, .5) * (1 - seg01(k, .85, 1)) : 0;
    for (const l of this.legs) {
      const qi = q + (l.s < 0 ? (l.k ? Math.PI : 0) : (l.k ? 0 : Math.PI));     // диагональные пары шагают вместе
      l.hip.rotation.x = -A * w * Math.sin(qi);
      l.hip.rotation.z = l.s * .45 * f;
      l.knee.rotation.x = .55 * w * Math.max(0, Math.cos(qi)) * (l.k ? -1 : 1) + .4 * f * (l.k ? -1 : 1);
    }
    const br = Math.sin(t * 1.1);
    this.body.position.y = .95 + .025 * w * Math.abs(Math.sin(q * 2)) + .01 * br - .45 * f;
    this.body.rotation.z = .05 * w * Math.sin(q) + Math.sin(t * .5) * .02 + Math.sin(t * 35) * .03 * r;
    this.body.rotation.x = -.06 * inhale + .08 * exhale + .25 * f;
    const sc = (1 + .04 * br + .28 * inhale - .06 * exhale + Math.sin(t * 25) * .05 * r) * (1 - .35 * f);
    this.sac.scale.set(sc, sc * 1.03, sc);
    this.head.rotation.x = .1 + Math.sin(t * .5) * .06 - .3 * inhale + .1 * exhale - .3 * r + .5 * f;
    this.head.rotation.y = Math.sin(t * .31) * .2 * (1 - w) * (1 - Math.min(1, k * 3));
    this.trunk.rotation.x = Math.sin(t * .9) * .12 * (1 - w) + .1 * w * Math.sin(q * 2) - .25 * inhale - .75 * exhale + .4 * f;
    this.trunk.rotation.z = Math.sin(t * .7) * .1 * (1 - exhale);

  }
  trunkTip() { return this.world(this.trunk, [0, .78, .52]); }
  pipeTips() { return [-1, 1].map(s => this.world(this.sac, [s * .5, 2.28, -.62])); }
}

// ---------- Ходуля: четыре длинные ноги на IK, ступни стоят на земле, шагает через стены ----------
const ST_L1 = .85, ST_L2 = 3.15, ST_R = 1.5;
class StiltRig extends Rig {
  constructor(level) {
    super('stilt', level);
    this.body = this.pivot(this.root, [0, 2.85, 0]);
    this.head = this.pivot(this.body, [0, 2.78, .2]);
    this.dangle = this.pivot(this.body, [0, 2.75, 0]);
    this.split((o, p) => {
      const rad = Math.hypot(p.x, p.z);
      if (rad > .42 && !o.isLight) return null;                                  // старые ноги: собираются заново ниже
      if (o.userData.lvlAdd && p.y < 2.6) return [this.body, [0, -.02, 0]];        // ледяное ядро древнего — внутрь тела
      if (p.y < 2.72 && rad < .3 && p.y > 1.4) return this.dangle;
      if (p.z > .15 && p.y < 2.9 && p.y > 2.4) return this.head;
      return this.body;
    });
    const l = level, op = l === 2 ? { transparent: true, opacity: .6 } : {};
    const mk = (c) => this.own(new THREE.MeshStandardMaterial({ color: rigTint(c, l), roughness: .85, flatShading: true, emissive: l ? new THREE.Color(l === 1 ? 0x0e2034 : 0x24527c) : 0x000000, ...op }));
    const segMat = [mk(C.fog), mk(0x262d38)], jointMat = mk(0x6c7480), clawMat = mk(C.claw), boneMat = mk(C.bone);
    const add = (geo, m) => { const mesh = new THREE.Mesh(geo, m); mesh.castShadow = true; this.root.add(mesh); return mesh; };
    this.legs = [];
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * Math.PI * 2 + Math.PI / 4, ca = Math.cos(a), sa = Math.sin(a);
      const leg = { i, a, out: V(ca, 0, sa), group: i % 2, hip: V(ca * .2, 0, sa * .2), rest: V(ca * ST_R, .02, sa * ST_R), plant: null, from: V(), to: V(), swing: false, k: 0, lift: 0, foot: V() };
      leg.femur = add(new THREE.CylinderGeometry(.035, .05, 1, 6), segMat[i % 2]);
      leg.tibia = add(new THREE.CylinderGeometry(.012, .035, 1, 6), segMat[(i + 1) % 2]);
      leg.knee = add(new THREE.IcosahedronGeometry(.06, 0), jointMat);
      leg.mid = [.3, .6].map(() => add(new THREE.IcosahedronGeometry(.032, 0), jointMat));
      leg.spike = add(new THREE.ConeGeometry(.025, .16, 4), boneMat);
      leg.claws = [-1, 0, 1].map(() => add(new THREE.ConeGeometry(.012, .08, 4), clawMat));
      this.legs.push(leg);
    }
    this.belly = new THREE.PointLight(0xff8a3c, 0, 3, 2); this.belly.position.set(0, 2.6, 0); this.body.add(this.belly);
    this.obstacle = () => 0;            // высота препятствия в точке мира (задаёт страница)
    this.hc = 2.85;
  }
  place(mesh, A, B) { const d = B.clone().sub(A); mesh.position.copy(A).addScaledVector(d, .5); mesh.scale.set(1, d.length(), 1); mesh.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); }
  // куда ставить ступню (мир): точка покоя, раздвинутая при посадке/смерти и вынесенная вперёд на ходу
  restWorld(leg, ahead) { const spread = 1 + .85 * this.pose.act + .7 * this.pose.fold; return this.root.localToWorld(leg.rest.clone().multiply(V(spread, 1, spread)).add(V(0, 0, ahead))); }

  update(dt, speed) {
    this.t += dt; const t = this.t, P = this.pose;

    this.head.rotation.y = Math.sin(t * .5) * .4 * (1 - w) * (1 - P.act) * Math.max(0, Math.sin(t * .27 + 2));

      const d0 = F.clone().sub(hipR), d = THREE.MathUtils.clamp(d0.length(), ST_L2 - ST_L1 + .01, ST_L1 + ST_L2 - .001), dir = d0.normalize();
      const a = (ST_L1 * ST_L1 - ST_L2 * ST_L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, ST_L1 * ST_L1 - a * a));
      const pl = leg.out.clone().multiplyScalar(.5).add(V(0, 1, 0)); const pole = pl.sub(dir.clone().multiplyScalar(dir.dot(pl))).normalize();
      const K = hipR.clone().addScaledVector(dir, a).addScaledVector(pole, h), footR = hipR.clone().addScaledVector(dir, d);
      this.place(leg.femur, hipR, K); this.place(leg.tibia, K, footR);
      leg.knee.position.copy(K); leg.mid.forEach((m, j) => m.position.copy(K).lerp(footR, [.3, .6][j]));
      leg.spike.position.copy(K).addScaledVector(pole, .06); leg.spike.quaternion.setFromUnitVectors(V(0, 1, 0), pole.clone().add(leg.out.clone().multiplyScalar(.4)).normalize());

    }

  }
  center() { return this.body.getWorldPosition(V()); }
}

};

function stepActor(dt) {
  const P = rig.pose, c = conf(); actor.timer += dt;
  let v = 0;
  if (actor.oneShot !== 'death') {
    switch (actor.phase) {
      case 'idle': break;
      case 'circle': { const R = c.circle, w = c.run / R, a = actor.timer * w, O = state.creature === 'crawler' ? ORIGIN : along(5, -2); actor.pos.set(O.x + Math.cos(a) * R, 0, O.z + Math.sin(a) * R); actor.yaw = Math.atan2(-Math.sin(a), Math.cos(a)); v = c.run; break; }
      case 'emerge': P.fade = Math.max(0, 1 - actor.timer / 1.2); if (Math.random() < dt * 20) spawnPuff(actor.pos.clone().add(new THREE.Vector3(rnd(c.dust[0]), Math.random() * c.dust[1] * .5, rnd(c.dust[0]))), c.dust[2] * 2); if (actor.timer > 1.2) setPhase('go'); break;
      default: v = BEH[state.creature](dt, P) || 0;
    }
  }
  // тень видна только в ярком свете: у фонаря и у горящего костра
  if (state.creature === 'shade') {
    let b = state.time === 'night' ? 0 : 1;
    for (const l of lamps) b = Math.max(b, 1 - (flat(l.base).distanceTo(flat(actor.pos)) - 1.6) / 1.2);
    b = Math.max(b, (1 - (flat(actor.pos).length() - 2.2) / 1.5) * Math.min(1, fuel * 2));
    P.vis += (THREE.MathUtils.clamp(b, .12, 1) - P.vis) * Math.min(1, dt * 3);
  }
  // разовые: удар и смерть
  if (actor.oneShot === 'hit') {
    actor.osT += dt; const k = actor.osT / .5; P.recoil = Math.max(0, Math.sin(Math.min(1, k) * Math.PI)); P.flash = Math.max(0, 1 - k * 2.2);
    if (actor.osT === dt) { const at = rig.mouthWorld ? rig.mouthWorld() : rig.center(); for (let i = 0; i < 6; i++) spawnPuff(at.clone().add(new THREE.Vector3(rnd(.3), rnd(.3), rnd(.3))), c.dust[2] * .8); }
    if (k >= 1) { actor.oneShot = null; P.recoil = 0; P.flash = 0; }
  }
  if (actor.oneShot === 'death') {
    actor.osT += dt; const t = actor.osT, T = c.foldT;
    P.latch = Math.max(0, (P.latch || 0) - dt * 3); P.recoil = Math.max(0, .6 - t * 2); P.flash = Math.max(0, 1 - t * 3);
    if (state.creature === 'brute' || state.creature === 'mistmother') P.act = 0; else P.act = Math.max(0, P.act - dt * 1.5);
    P.fold = Math.min(1, t / T);
    if (t > T) { P.fade = Math.min(1, (t - T) / 1.0); if (Math.random() < dt * 35 * (1 - P.fade * .5)) spawnPuff(actor.pos.clone().add(new THREE.Vector3(rnd(c.dust[0]), .1 + Math.random() * c.dust[1] * .4, rnd(c.dust[0]))), c.dust[2] * (1 + Math.random())); }
    if (t > T + 2.2) { actor.oneShot = null; P.fold = 0; hits = 0; if (state.mode === 'scene' || state.mode === 'drain') { buildProps(); resetActor(); } else { P.fade = 1; actor.fadeIn = true; } ui(); }
  }
  if (actor.fadeIn) { P.fade = Math.max(0, P.fade - dt * 1.2); if (P.fade === 0) actor.fadeIn = false; }
  rig.root.position.copy(actor.pos); rig.root.rotation.y = actor.yaw;
  rig.update(dt, v / rig.root.scale.x);
}

// ---------- интерфейс ----------
const HITS = (n) => n === 2 ? 'второго удара' : n === 3 ? 'третьего удара' : 'четвёртого удара';
const TEXT = {
  crawler: { idle: 'Стоит у огня: дышит грудью, оглядывается, жвалы подёргиваются, хвост покачивается, изредка переставляет лапу.', run: 'Бежит со скоростью из игры (2.5 блока/с) походкой «треногой», как насекомое: три лапы опираются, три переносятся вперёд. Тело покачивается, брюшко виляет.', drain: 'Подбегает, приседает и обнимает костёр передними лапами, жуёт жвалами. Искры жара летят ему в пасть, брюхо разгорается, огонь тускнеет и гаснет.', hit: 'вздрагивает, вспыхивает, отскакивает назад, лапы дёргаются', death: 'поджимает лапы, падает и рассыпается в туман' },
  brute: { idle: 'Тяжело дышит, плечи ходят вверх-вниз, руки висят до земли. Медленно поворачивает голову, иногда фыркает.', run: 'Идёт медленно и тяжело (1.3 блока/с): шаг под скорость, корпус переваливается, руки качаются навстречу ногам.', drain: 'Подходит к стене, заносит оба кулака над головой и бьёт сверху. Блоки разлетаются, после третьего удара стены нет, и он идёт дальше к огню.', hit: 'почти не замечает: дёргает головой, вспыхивает, чуть отшатывается', death: 'падает на колени, валится вперёд на кулаки и рассыпается' },
  shade: { idle: 'Парит над землёй, подол колышется, голова медленно склоняется набок. В темноте почти не видна.', run: 'Скользит без шагов: наклоняется вперёд, руки и подол тянутся назад.', drain: 'Обходит фонарь по краю света, чтобы не проявиться. У костра поднимается, вытягивает руки к огню, и из ладоней к нему тянется чёрный дым: огонь задыхается, мечется и гаснет. Рядом с ярким огнём становится видна.', hit: 'отшатывается, вспыхивает и дрожит', death: 'оседает в подол, складывается и рассыпается' },
  moths: { idle: 'Стайка кружит облаком, каждый мотылёк машет крыльями сам.', run: 'Летят вытянутым потоком, на поворотах кренятся.', drain: 'Летят на свет, садятся на фонарь со всех сторон и медленно раскрывают крылья. Фонарь тускнеет.', hit: 'разлетаются в стороны и снова собираются', death: 'складывают крылья и падают, кружась' },
  mistmother: { idle: 'Мешок с туманом дышит, хобот покачивается, голова опущена.', run: 'Медленно идёт на четырёх ногах (1 блок/с), диагональные пары шагают вместе, мешок покачивается.', drain: 'Останавливается поодаль, раздувает мешок, поднимает хобот и выдыхает туман. Туман ползёт к огню, огонь тускнеет, рабочий бросает работу и пятится.', hit: 'мешок трясётся, она вспыхивает', death: 'ноги разъезжаются, мешок сдувается, она оседает и рассыпается' },
  stilt: { idle: 'Тело покачивается высоко над землёй, голова оглядывается. Если ступня отстала, переставляет её.', run: 'Шагает диагональными парами, ступни стоят на земле и не скользят.', drain: 'Подходит к стене в три блока и переступает её высоко поднятыми ногами, тело проходит над стеной. Над костром раздвигает ноги и садится прямо на огонь.', hit: 'тело подпрыгивает, ноги дёргаются', death: 'ноги разъезжаются, тело падает на землю и рассыпается' },
};
function ui() {
  const id = state.creature, c = conf(), T = TEXT[id];
  document.querySelectorAll('#creatures button').forEach(b => b.classList.toggle('on', b.dataset.v === id));
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.v === state.mode));
  document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('on', +b.dataset.v === state.level));
  document.querySelectorAll('#speeds button').forEach(b => b.classList.toggle('on', +b.dataset.v === state.speed));
  document.querySelectorAll('#times button').forEach(b => b.classList.toggle('on', b.dataset.v === state.time));
  document.getElementById('actBtn').textContent = c.act;
  const heads = { idle: '1. Покой', run: '2. Бег', drain: c.act, scene: 'Сценка' };
  const body = state.mode === 'scene' ? `Выходит из тумана и делает своё (${c.act.slice(3).toLowerCase()}). Нажимай «Удар»: после ${HITS(c.hp)} умирает, затем выходит следующий.` : T[state.mode];
  document.getElementById('info').innerHTML = `<b>${heads[state.mode]}</b><p>${body}</p><p class="w">4. Удар: ${T.hit}. 5. Смерть: ${T.death}.${state.mode === 'scene' ? ` Ударов: ${hits} из ${c.hp}.` : ''}</p>`;
}
document.querySelectorAll('#creatures button').forEach(b => b.onclick = () => { state.creature = b.dataset.v; fear = 0; makeRig(); setCam(conf().cam, ls()); setMode(state.mode); });
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.v));
document.querySelectorAll('#levels button').forEach(b => b.onclick = () => { state.level = +b.dataset.v; makeRig(); setCam(conf().cam, ls()); setMode(state.mode); });
document.querySelectorAll('#speeds button').forEach(b => b.onclick = () => { state.speed = +b.dataset.v; ui(); });
document.querySelectorAll('#times button').forEach(b => b.onclick = () => { state.time = b.dataset.v; applyTime(); ui(); });

function applyTime() {
  const night = state.time === 'night', bg = night ? 0x141c28 : 0xaab8c4;
  scene.background = new THREE.Color(bg); scene.fog = night ? new THREE.FogExp2(0x1c2635, .04) : new THREE.Fog(bg, 30, 80);
  hemi.intensity = night ? 1.0 : 1.1; hemi.color.set(night ? 0x6f88a8 : 0xc4d0dc); hemi.groundColor.set(night ? 0x1b2026 : 0x4c5232);
  sun.intensity = night ? .9 : 2.3; sun.color.set(night ? 0x8fa8d8 : 0xfff0dc); renderer.toneMappingExposure = night ? 1.2 : 1.05;
}
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); applyTime(); makeRig();
if (q.get('cam')) setCam(q.get('cam').split(',').map(Number)); else setCam(conf().cam, ls());
setMode(state.mode);

// для снимков: ?t=секунды прокручивает время, ?shot=hit|death запускает разовое действие в момент shotAt
const warp = +(q.get('t') || 0), shot = q.get('shot'), shotAt = +(q.get('shotAt') || 0);
const DT = 1 / 60; let simT = 0;
function sim(dt) {
  if (shot && simT < shotAt && simT + dt >= shotAt) startOneShot(shot);
  simT += dt;
  stepActor(dt);
  const night = state.time === 'night';
  if (state.creature !== 'shade' || state.mode === 'idle' || state.mode === 'run') choke = 0;
  flames.forEach((f, i) => { const s = Math.max(.02, fuel) * (1 - choke * .35 * Math.abs(Math.sin(simT * (11 + i * 3)))); f.scale.set(s, s * (1 + Math.sin(simT * 9 + i * 2) * .15), s); f.visible = fuel > .02; });
  emberMat.emissiveIntensity = .3 + fuel * .9;
  fireLight.intensity = (night ? 7 : 1.5) * (.08 + .92 * fuel) * (1 + Math.sin(simT * 13) * .06);
  for (const l of lamps) { l.light.intensity = (night ? 16 : 3) * l.dim * (1 + Math.sin(simT * 11) * .04); l.glass.emissiveIntensity = .2 + 1.2 * l.dim; }
  if (state.creature !== 'mistmother' || state.mode === 'idle' || state.mode === 'run') fear = Math.max(0, fear - dt * .5);
  worker.position.set(WORKER.x - fear * .8, 0, WORKER.z - fear * .5); worker.rotation.y = WORKER.ry + fear * 2.4; worker.rotation.z = Math.sin(simT * 30) * .02 * fear;
  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.t += dt * 1.8; const to = s.to(); const p = s.from.clone().lerp(to, s.t); p.y += Math.sin(s.t * Math.PI) * s.arc; p.x += Math.sin(s.t * Math.PI) * s.side; s.m.position.copy(p); s.m.material.opacity = 1 - s.t * .5; if (s.t >= 1) { scene.remove(s.m); sparks.splice(i, 1); } }
  for (let i = puffs.length - 1; i >= 0; i--) { const p = puffs[i]; p.t += dt; p.m.position.addScaledVector(p.v, dt); p.m.scale.setScalar(p.size * 2 * (1 + p.t * p.grow)); p.m.material.opacity = p.op * Math.min(1, p.t * 5) * (1 - p.t / p.life); if (p.t > p.life) { scene.remove(p.m); p.m.material.dispose(); puffs.splice(i, 1); } }
  for (let i = debris.length - 1; i >= 0; i--) { const d = debris[i]; d.t += dt; d.v.y -= 9.8 * dt; d.m.position.addScaledVector(d.v, dt); if (d.m.position.y < .45) { d.m.position.y = .45; d.v.multiplyScalar(.35); d.v.y = Math.abs(d.v.y) * .3; d.w.multiplyScalar(.5); } d.m.rotation.x += d.w.x * dt; d.m.rotation.z += d.w.z * dt; if (d.t > 2.5) d.m.scale.setScalar(Math.max(.01, 1 - (d.t - 2.5) * 1.5)); if (d.t > 3.2) { props.remove(d.m); debris.splice(i, 1); } }
  shake = Math.max(0, shake - dt * .6);
}
while (simT < warp) sim(DT);
const clock = new THREE.Clock(), still = q.get('still') === '1';
function frame() {
  if (!still) { let dt = Math.min(.05, clock.getDelta()) * state.speed; while (dt > 1e-4) { const s = Math.min(DT, dt); sim(s); dt -= s; } }
  if (!still || !frame.done) { controls.update(); }
  const off = new THREE.Vector3(rnd(shake), rnd(shake), rnd(shake)); camera.position.add(off);
  renderer.render(scene, camera); camera.position.sub(off); frame.done = true; window.done = true;
  if (!still) requestAnimationFrame(frame);
}
ui(); frame();
</script>
