<script type="module">
import * as THREE from 'three';

// ===== Бестиарий Emberhold: модели в гранёном стиле (1 единица = 1 блок) =====

const CREATURES = [];

// Рост относительно рабочего (1.9 блока): h — высота модели, w — размах крыльев, f — готовый множитель для стаи
const SIZE = {
  crawler: ['h', 1], tarblob: ['h', 1.3], tinnik: ['h', 1.8], rootling: ['h', 2], stoneeater: ['h', 2],
  drowned: ['h', 2.4], lamplighter: ['h', 2.4], armor: ['h', 2.5], avalanche: ['h', 2.5], shade: ['h', 2.8],
  mistmother: ['h', 3], stag: ['h', 3], brute: ['h', 3.5], stilt: ['h', 5], golem: ['h', 6], cedarguard: ['h', 7], keeper: ['h', 10],
  slimes: ['h', 2.2], moths: ['f', 1.5], jackdaws: ['f', 2], owl: ['w', 3.5],

const sizeCache = new Map();

// ================= облик уровней: туман забирает существо =================
// Матёрый: иней и синеватый отлив, ледяная броня сверху, светящиеся трещины, изморозь под ногами.
// Древний: полупрозрачное туманное тело, ледяное ядро, корона кристаллов, кружащие осколки,
// кольцо инея и тёмный круг на земле — вокруг древнего свет слабеет.

// ===== base: общие помощники этого файла =====
const BASE_CRACK = 0x9fd8ff, BASE_GLOW = 0x7fc3ff, BASE_WISP = 0xaabfd2;
// светящаяся трещина-ломаная
function base_crack(b, pts, w, l, o = {}) {
  for (let i = 0; i < pts.length - 1; i++) b.S(pts[i], pts[i + 1], w, w * .7, BASE_CRACK, { emissive: BASE_GLOW, ei: (o.ei ?? .7) + l * .4, sides: 4, parent: o.parent });
}
// плоская полоса (ткань, ремень) между точками; yaw поворачивает ширину вокруг оси
function base_plank(b, a, c, w, t, color, yaw = 0, o = {}) {
  const A = V3(a), B = V3(c), len = A.distanceTo(B);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, len, t), M(color, o));
  m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize()); m.rotateY(yaw);
  return b.add(m, o.parent);
}
// рваная тканевая лента: два сужающихся куска и зубец
function base_strip(b, top, len, w, color, yaw, out = [0, 0], o = {}) {
  const mid = [top[0] + out[0] * .5, top[1] - len * .55, top[2] + out[1] * .5], end = [top[0] + out[0], top[1] - len, top[2] + out[1]];
  base_plank(b, top, mid, w, .015, color, yaw, o);
  base_plank(b, mid, end, w * .7, .015, color, yaw, o);
  b.K([end[0], end[1] + .03, end[2]], [out[0] * .3, -1, out[1] * .3], w * .35, len * .2, color, { sides: 3, ...o });
}
// кольцо (тор)
function base_ring(b, c, r, tube, color, rot, o = {}) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, o.rs ?? 4, o.ts ?? 10), M(color, o));
  m.position.set(...c); if (rot) m.rotation.set(...rot); if (o.scale) m.scale.set(...o.scale); return b.add(m, o.parent);
}
// пучок шерсти из маленьких конусов
function base_tuft(b, c, dir, n, r, h, color, seed, o = {}) {
  const rr = rngC(seed);
  for (let i = 0; i < n; i++) {
    const d = [dir[0] + (rr() - .5) * .9, dir[1] + (rr() - .5) * .9, dir[2] + (rr() - .5) * .9];
    b.K([c[0] + (rr() - .5) * r * 3, c[1] + (rr() - .5) * r * 2, c[2] + (rr() - .5) * r * 3], d, r, h * (.7 + rr() * .6), color, { sides: 3, ...o });
  }
}
// клок тумана
// клочья тумана убраны у всех существ: выглядели как твёрдые шары
function base_wisp() { return null; }
// сустав-цепочка с чередованием цветов сегментов и отдельным цветом суставов
function base_limb(b, pts, r0, r1, colors, jointColor, o = {}) {
  for (let i = 0; i < pts.length - 1; i++) {
    const ra = r0 + (r1 - r0) * i / (pts.length - 1), rb = r0 + (r1 - r0) * (i + 1) / (pts.length - 1);
    b.S(pts[i], pts[i + 1], ra, rb, colors[i % colors.length], o);
    if (i > 0) b.E(pts[i], ra * 1.3, jointColor, null, { ...o, detail: 0, j: .25 });
  }
}

// ===== local1: Тинник, Галки тумана, Корневик, Смоляк, Утопец (детализированные) =====
// --- локальные помощники ---
function local1_n(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
// точка на поверхности эллипсоида c,r в направлении dir (k — множитель радиуса)
function local1_onE(c, r, dir, k = 1) { const u = local1_n(dir); return [c[0] + r[0] * u[0] * k, c[1] + r[1] * u[1] * k, c[2] + r[2] * u[2] * k]; }
// бугорки/бородавки по поверхности эллипсоида
function local1_bumps(b, c, r, n, size, colors, seed, ok, o = {}) {
  const R = rngC(seed); let placed = 0, tries = 0;
  while (placed < n && tries < n * 40) {
    tries++; const d = [R() * 2 - 1, R() * 2 - 1, R() * 2 - 1]; if (Math.hypot(d[0], d[1], d[2]) > 1) continue;
    const u = local1_n(d); if (ok && !ok(u)) continue;
    const p = local1_onE(c, r, u, o.k ?? .97), s = size * (.6 + R() * .8);
    b.E(p, [s, s * (o.flat ?? .7), s], colors[placed % colors.length], null, { detail: 0, j: .25, ...(o.mat || {}) }); placed++;
  }
}
// светящаяся холодная трещина по точкам
function local1_crack(b, pts, l, w = .012) {
  for (let i = 0; i < pts.length - 1; i++) b.S(pts[i], pts[i + 1], w, w * .8, 0x9fd8ff, { emissive: 0x7fc3ff, ei: .6 + l * .35, sides: 4 });
}
// трещина по поверхности эллипсоида (направления -> точки)
function local1_crackE(b, c, r, dirs, l, w = .012, k = 1.02) { local1_crack(b, dirs.map(d => local1_onE(c, r, d, k)), l, w); }
// свисающая капля/прядь с утолщением на конце
function local1_drip(b, top, len, r, color, o = {}) {
  const end = [top[0] + (o.dx ?? 0), top[1] - len, top[2] + (o.dz ?? 0)];
  b.S(top, end, r, r * .55, color, o); b.E(end, [r * 1.3, r * 1.7, r * 1.3], color, null, { ...o, detail: 0 }); return end;
}
// перепончатая лапа: пальцы веером от точки, с подушечками и перепонкой
function local1_webFoot(b, base, s, n, len, spread, aim, col, padCol, webCol, o = {}) {
  const a0 = Math.atan2(aim[0] * s, aim[1]);
  const tips = [];
  for (let k = 0; k < n; k++) {
    const a = a0 + (k / (n - 1) - .5) * spread, L = len * (k === 0 || k === n - 1 ? .8 : 1);
    const mid = [base[0] + Math.sin(a) * L * .5, base[1] + .015, base[2] + Math.cos(a) * L * .5];
    const tip = [base[0] + Math.sin(a) * L, o.y ?? .02, base[2] + Math.cos(a) * L];
    b.S(base, mid, o.r ?? .018, (o.r ?? .018) * .8, col, { sides: 4 }); b.S(mid, tip, (o.r ?? .018) * .8, (o.r ?? .018) * .55, col, { sides: 4 });
    b.E(tip, [.022, .014, .022], padCol, null, { detail: 0 });
    if (o.claw) b.K(tip, [Math.sin(a), -.3, Math.cos(a)], .01, .035, o.claw, { sides: 4 });
    tips.push(tip);
  }
  // перепонки между пальцами
  for (let k = 0; k < tips.length - 1; k++) {
    const m = [(tips[k][0] + tips[k + 1][0] + base[0]) / 3, (o.y ?? .02) + .006, (tips[k][2] + tips[k + 1][2] + base[2]) / 3];
    b.E(m, [len * .22, .008, len * .3], webCol, [0, a0 + ((k + .5) / (n - 1) - .5) * spread, 0], { detail: 0, j: .1 });
  }
}

for (let i = 0; i < 4; i++) { const l = new THREE.Mesh(new THREE.CylinderGeometry(.09, .11, .9, 6), logMat); l.rotation.z = Math.PI / 2 - .35; l.rotation.y = i * Math.PI / 2; l.position.y = .18; l.castShadow = true; fire.add(l); }
for (let i = 0; i < 8; i++) { const s = new THREE.Mesh(new THREE.DodecahedronGeometry(.14, 0), stoneMat); const a = i / 8 * Math.PI * 2; s.position.set(Math.cos(a) * .55, .08, Math.sin(a) * .55); fire.add(s); }
const flameMat = new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: .9 }); const flames = [];
for (let i = 0; i < 3; i++) { const f = new THREE.Mesh(new THREE.ConeGeometry(.22 - i * .05, .7 - i * .12, 5), flameMat); f.position.set((i - 1) * .1, .5, (i % 2) * .08); fire.add(f); flames.push(f); }

const shown = new THREE.Group(); scene.add(shown);
const labels = document.getElementById('labels'); let labelItems = [];
let userMoved = false; controls.addEventListener('start', () => { userMoved = true; });

function el(tag, attrs, text) { const e = document.createElement(tag); Object.assign(e, attrs); if (text) e.textContent = text; return e; }
function buildMenus() {
  const gEl = document.getElementById('groups'); [...gEl.querySelectorAll('button')].forEach(b => b.remove());
  GROUPS.forEach(([id, name]) => { const b = el('button', {}, name); b.dataset.v = id; b.classList.toggle('on', state.group === id); b.onclick = () => { state.group = id; state.creature = 'all'; userMoved = false; rebuild(); }; gEl.appendChild(b); });
  const cEl = document.getElementById('creatures'); [...cEl.querySelectorAll('button')].forEach(b => b.remove());
  const all = el('button', {}, 'Все'); all.classList.toggle('on', state.creature === 'all'); all.onclick = () => { state.creature = 'all'; userMoved = false; rebuild(); }; cEl.appendChild(all);
  CREATURES.filter(d => groupOf(d) === state.group).forEach(d => { const b = el('button', {}, d.name); b.classList.toggle('on', state.creature === d.id); b.onclick = () => { state.creature = d.id; userMoved = false; rebuild(); }; cEl.appendChild(b); });
  document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('on', +b.dataset.v === state.level));
  document.getElementById('levels').style.opacity = state.creature === 'all' ? 1 : .45;
  document.querySelectorAll('#times button').forEach(b => b.classList.toggle('on', b.dataset.v === state.time));
}
document.querySelectorAll('#levels button').forEach(b => b.onclick = () => { state.level = +b.dataset.v; rebuild(); });
document.querySelectorAll('#times button').forEach(b => b.onclick = () => { state.time = b.dataset.v; rebuild(); });

function dispose(g) { g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); g.clear(); }
const LEVELS = ['Обычный', 'Матёрый', 'Древний'];

let fireDim = 1;
// Рамка тела без земли под существом и кружащих осколков (они не должны раздвигать ряд)
function bodyBox(g) {
  g.updateMatrixWorld(true); const box = new THREE.Box3(), tmp = new THREE.Box3();
  g.traverse(o => { if (o.isMesh && !o.userData.lvlAdd) { tmp.setFromObject(o); box.union(tmp); } });
  return box;
}
function rebuild() {
  buildMenus(); dispose(shown); labels.innerHTML = ''; labelItems = [];
  const defs = CREATURES.filter(d => groupOf(d) === state.group);
  let items = state.creature === 'all' ? defs.map(d => ({ d, l: state.level })) : [0, 1, 2].map(l => ({ d: defs.find(x => x.id === state.creature), l }));
  const built = items.map(it => { const g = buildCreatureV2(it.d, it.l); g.rotation.y = .4; const box = bodyBox(g); return { ...it, g, box }; });
  const maxW = Math.max(...built.map(b => b.box.max.x - b.box.min.x)); const gap = items.some(it => it.l === 2) ? .9 + maxW * .45 : .9; let total = built.reduce((s, b) => s + (b.box.max.x - b.box.min.x), 0) + gap * (built.length - 1);
  let x = -total / 2, maxH = 0;
  for (const b of built) {
    const w = b.box.max.x - b.box.min.x; b.g.position.x = x - b.box.min.x; x += w + gap;
    b.g.position.y = b.d.float || 0; b.g.userData.baseY = b.g.position.y; shown.add(b.g);
    const h = b.box.max.y; maxH = Math.max(maxH, h);
    const lab = el('div', { className: 'lab' }); lab.innerHTML = state.creature === 'all' ? `${b.d.name}<i>${b.d.where}</i>` : `${LEVELS[b.l]}<i>${b.d.name}</i>`;
    labels.appendChild(lab); labelItems.push({ el: lab, pos: new THREE.Vector3(b.g.position.x + (b.box.min.x + b.box.max.x) / 2, h + (b.d.float || 0) + .3, 0) });
  }
  refBlock.position.set(total / 2 + gap, 0, 0); refBlock.rotation.y = -.4; total += 2;
  fire.position.set(-Math.min(total / 2, 3) * .4, 0, Math.max(2.2, maxH * .45) + 1); fireLight.position.set(0, 1.1, fire.position.z);
  const ancient = items.some(it => it.l === 2);
  fireDim = ancient ? .45 : 1;
  flames.forEach(f => f.scale.setScalar(ancient ? .6 : 1));
  const one = state.creature !== 'all' ? defs.find(x => x.id === state.creature) : null;
  const info = document.getElementById('info');
  info.innerHTML = one ? `<b>${one.name}</b> <span class="w">· ${one.where}</span><p>${one.threat}</p>` : defs.map(d => `<b>${d.name}</b> <span class="w">· ${d.threat}</span>`).join('<br>');
  const LV = ['Обычный: тёмный, чистый силуэт.', 'Матёрый: иней и ледяная броня, светящиеся трещины, изморозь под ногами. Крепче и сильнее.', 'Древний: тело из тумана с ледяным ядром, корона кристаллов, кружащие осколки, кольцо инея. Свет вокруг слабеет: огонь рядом горит тусклее.'];
  info.innerHTML += one ? LV.map(x => `<p class="w">${x}</p>`).join('') : `<p class="w">${LV[state.level]}</p>`;
  if (!userMoved) {
    const aspect = innerWidth / innerHeight, span = Math.max(total + 3, 4);
    const dist = Math.max(span / aspect, maxH * 2.0, 3.5) / (2 * Math.tan(THREE.MathUtils.degToRad(18))) * 1.15;
    camera.position.set(dist * .22, maxH * .5 + dist * .32, dist); controls.target.set(0, maxH * .48, 0);
  }
  applyTime();
}
function applyTime() {
  const night = state.time === 'night', bg = night ? 0x141c28 : 0xaab8c4;
  scene.background = new THREE.Color(bg); scene.fog = night ? new THREE.FogExp2(0x1c2635, .02) : new THREE.Fog(bg, 50, 120);
  hemi.intensity = night ? 1.0 : 1.1; hemi.color.set(night ? 0x6f88a8 : 0xc4d0dc); hemi.groundColor.set(night ? 0x1b2026 : 0x4c5232);
  sun.intensity = night ? .9 : 2.3; sun.color.set(night ? 0x8fa8d8 : 0xfff0dc);
  fireLight.intensity = (night ? 7 : 1.5) * fireDim; renderer.toneMappingExposure = night ? 1.2 : 1.05;
  shown.traverse(o => { if (o.isSprite && o.userData.glow !== undefined) o.material.opacity = o.userData.glow * (night ? 1 : .35); });
}
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); if (!userMoved) rebuild(); }); resize(); rebuild();

const clock = new THREE.Clock(), still = q.get('still') === '1';
function frame() {
  const t = still ? 1.1 : clock.getElapsedTime();
  flames.forEach((f, i) => { f.scale.y = f.scale.x * (1 + Math.sin(t * 9 + i * 2) * .15); f.rotation.y = t * (1 + i); });
  if (state.time === 'night') fireLight.intensity = fireDim * 7 + Math.sin(t * 13) * .5 + Math.sin(t * 7.1) * .4;
  shown.children.forEach((c, i) => {
    if (c.userData.def.float) c.position.y = c.userData.baseY + Math.sin(t * 1.5 + i) * .07;
    c.traverse(o => {
      if (o.userData.orbit) { const ob = o.userData.orbit, a = t * ob.sp + ob.ph; o.position.set(ob.cx + Math.cos(a) * ob.r, ob.y + Math.sin(t * 2 + ob.ph) * ob.r * .05, ob.cz + Math.sin(a) * ob.r); o.rotation.y = a * 2; }
      if (o.userData.flap) o.rotation.z = o.userData.flap * Math.sin(t * 9 + i) * o.userData.flapAmp * .5;
      if (o.userData.bob) { if (o.userData.y0 === undefined) o.userData.y0 = o.position.y; o.position.y = o.userData.y0 + Math.sin(t * 2 + o.userData.bob.ph) * .08; }
    });
  });
  controls.update(); renderer.render(scene, camera);
  labelItems.forEach(l => { const p = l.pos.clone().project(camera); l.el.style.left = (p.x * .5 + .5) * innerWidth + 'px'; l.el.style.top = (-p.y * .5 + .5) * innerHeight + 'px'; l.el.style.display = p.z < 1 ? '' : 'none'; });
  window.done = true;
  if (!still) requestAnimationFrame(frame);
}
frame();
</script>
